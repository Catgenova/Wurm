          # Two payments out of one purse at the same moment: the first pays,
          # the second waits for it, counts what is left and is refused.
          npx esbuild supabase/test/purse.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/purse.mjs --log-level=error
          node node_modules/.cache/purse.mjs

      - name: A grave where you fell
        run: |
          # On both sides, on dry ground with deep water off it: a death buries
          # the pack, the hands, the toolbelt and every bag with what is in it
          # where the body fell, and says so with the hour put in from the rule;
          # what is worn stays on, and so do a crate with a wildermon in it and
          # what is held in a deal; in deep water the grave is on the nearest
          # dry ground in reach; a second death digs beside the first and one
          # carrying nothing digs none; only its owner opens it or takes from
          # it, anybody else is told whose it is and shown nothing in it, and
          # nobody takes a spadeful out of it; its hour up the sweep takes it
          # off an index of when graves crumble, and it is marked on its
          # owner's map and survives a save.
          npx esbuild supabase/test/graves.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/graves.mjs --log-level=error
          node node_modules/.cache/graves.mjs

      - name: An island's keepers, and the four things only they may do
        run: |
          # Who keeps an island: whoever founded it, and anybody the deploy's own
          # SQL (supabase/owner.sql, run here against a test address) made an
          # owner of every island. Every owner door refuses everybody else, and
          # before it does anything at all. Then each tool does what it says:
          # who is on, a body moved off a stuck spot and told who moved it, a
          # mute that refuses talk, letters and a parcel's note and lifts on
          # time or when lifted, a pile cleared, and the trail of all of it.
          npx esbuild supabase/test/keeper.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/keeper.mjs --log-level=error
          node node_modules/.cache/keeper.mjs

      - name: What everybody on an island has on
        run: |
          # A body is drawn in its gear, and somebody else's pack is not yours to
          # read: the island says what each body has on, a slot at a time, as
          # the thing, how rare, what it is made of and its dye -- and not a
          # thing put down but still written as worn, nor anything of its
          # quality; to somebody on the island, and to nobody else.
          npx esbuild supabase/test/worn.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/worn.mjs --log-level=error
          node node_modules/.cache/worn.mjs

      - name: Climbing that stays climbed
        run: |
          # Reported: "climbing seems to level up then resets to 1". The browser
          # raised it for itself and the island never did, so the book the
          # island sends wrote it back. The same hillside goes to both sides:
          # the island pays a go a step off the walk it is told about, at the
          # browser's rate; the browser pays nothing where the island owns the
          # body and the same goes where it does not; and flat ground, a gentle
          # slope, a storey and a saddle teach nothing on either.
          npx esbuild supabase/test/climb.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/climb.mjs --log-level=error
          node node_modules/.cache/climb.mjs

      - name: Driving and sailing
        run: |
          # Two skills of the reins and the helm: each makes what it steers go
          # faster by the same sum on both sides, the island lets the faster
          # pace stand, and each is paid a go for every tile the cart or the
          # hull goes into under way -- and nothing for a cart nothing pulls.
          npx esbuild supabase/test/travel.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/travel.mjs --log-level=error
          node node_modules/.cache/travel.mjs

      - name: An altar goes up on your own ground
        run: |
          # Asked for: "Make the altar only craftable within deed perimeter".
          # The same recipes carry the flag on both sides, and both refuse an
          # altar in the same words off a settlement of yours: on one you
          # founded it goes up, to its last tile and not a tile past it; on a
          # neighbour's it does not, until you are a citizen of it.
          npx esbuild supabase/test/deedaltar.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/deedaltar.mjs --log-level=error
          node node_modules/.cache/deedaltar.mjs

      - name: Baubles, found, restored and set into the altar
        run: |
          # Asked for: a share of archaeology's finds are baubles, restored like
          # relics and set into a settlement's altar for bonuses to its citizens
          # on its land. Both sides hold the same tiers, skills and words, read
          # each other's baubles, refuse a setting in the same words, and give
          # the same time, skill and yield -- through the clock, on the island.
          npx esbuild supabase/test/baubles.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/baubles.mjs --log-level=error
          node node_modules/.cache/baubles.mjs

      - name: Dirt is collected, moss cut, and moss and grass planted on dirt, the same on both sides
        run: |
          # Asked for: collect dirt on its tile, as clay and sand are collected;
          # moss cut off a moss tile as grass is cut, giving moss; and ten moss
          # planted on a dirt tile to turn it to moss. Both sides offer and
          # refuse the same, give dirt off dirt and moss off moss (digging moss
          # still gives dirt), keep a cut tile short until it grows back, and
          # turn the dirt to moss for the same moss. And a tile of dirt dug
          # bare still shows the rock on both sides, where a bed of sand stays
          # sand: dirt is collected from, but it is not a bed. Then, after a
          # player found no way to plant grass: as much mixed grass as moss
          # planted on dirt turns it to grass, refused in the same words.
          npx esbuild supabase/test/moss.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/moss.mjs --log-level=error
          node node_modules/.cache/moss.mjs

      - name: A find nobody has restored takes no repair
        run: |
          # Asked for: an artifact that has not been restored cannot be repaired,
          # and one that breaks before it is restored is gone. Repair, a repair
          # kit and Mend refuse a fragment or a tarnished bauble in the same
          # words on both sides, a worker mending the stores passes it by,
          # Restore takes it at any damage short of breaking, and at the most
          # damage a thing takes it is gone.
          npx esbuild supabase/test/unrestored.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/unrestored.mjs --log-level=error
          node node_modules/.cache/unrestored.mjs

      - name: A sacrifice at the altar, and the motes it leaves
        run: |
          # Asked for: rare, supreme and fantastic things given up at the
          # altar fill every nutrient; one in a hundred leaves a mote of the
          # same rarity, which gives an ordinary thing that rarity. Both sides
          # refuse the same things in the same words and do the same.
          npx esbuild supabase/test/sacrifice.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/sacrifice.mjs --log-level=error
          node node_modules/.cache/sacrifice.mjs

      - name: The Bauble of Regret, and a trade undone
        run: |
          # Asked for: a 3% chance of a Bauble of Regret in archaeology, which
          # undoes a trade. Both sides turn one up as often, off the same roll
