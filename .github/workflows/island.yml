# The island, checked three ways.
#
# `rules` needs nothing and runs on every push: a Postgres of its own, built
# from the migrations in this repo, with the whole suite over it. That is the
# one that catches things, and it costs no secrets and no project.
#
# `migrate` and `smoke` touch the real project and so need credentials. They
# exist because there are things no local database can tell you: whether
# anonymous sign-in is switched on, whether Realtime is publishing, whether the
# policies behave the same behind PostgREST as behind psql, and whether eight
# megabytes of island survives the trip.
name: Island

# The paths are the whole of `src`, which they were not. They used to be
# `supabase/**` and `src/net/**`, from when everything in this suite was about
# the island and the wire. That has not been true for a while: half the tests
# under `supabase/test/` now measure browser code — what a beast is drawn
# turned to, what a building shelters, what a job sounds like — and a change
# to `src/render/sprites.ts` that broke `turned.ts` would have gone through
# without the suite running at all.
on:
  push:
    paths:
      - 'supabase/**'
      - 'src/**'
      - '.github/workflows/island.yml'
  pull_request:
    paths:
      - 'supabase/**'
      - 'src/**'
  workflow_dispatch:
    inputs:
      live:
        description: 'Also push migrations to the project and smoke-test it'
        type: boolean
        default: false
      found:
        description: 'Found a new island on the project and open it'
        type: boolean
        default: false
      size:
        description: 'How many tiles a side the new island is'
        default: '4096'
      island_name:
        description: 'What the new island is called'
        default: 'Wildermon'
      seed:
        description: 'Its seed; blank rolls one'
        default: ''
      reconcile:
        description: 'Put the island and the browsers back on the same ground'
        type: choice
        options: ['off', 'report', 'write']
        default: 'off'

jobs:
  rules:
    name: The rules, against a Postgres of our own
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wurm
          POSTGRES_PASSWORD: wurm
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: wurm
      PGPASSWORD: wurm
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: No migration has been deleted or renamed
        run: |
          # A migration the project has already run is a fact about its
          # history, and the CLI refuses to push when the remote holds a
          # version the repository has forgotten: "Remote migration versions
          # not found in local migrations directory". Replacing a function
          # means a NEW migration, never an edited or renamed one.
          gone=$(git diff --diff-filter=DR --name-only HEAD~1 HEAD -- supabase/migrations/ || true)
          if [ -n "$gone" ]; then
            echo "::error::These migrations were deleted or renamed, which will break 'supabase db push':"
            echo "$gone"
            exit 1
          fi
          echo "no migrations removed"
      - name: No migration has been added out of order
        run: |
          # Append-only is not only about editing: a migration added *before*
          # one the project has already run is one the CLI will refuse to push
          # ("Found local migration files to be inserted before the last
          # migration on remote database"). The generated definitions carry a
          # wall-clock stamp and the hand-written ones carry one chosen by
          # hand, so the two can cross. Caught here, it is a rename away from
          # fixed; caught at the project, it is a failed deploy.
          last=$(git ls-tree -r --name-only HEAD~1 -- supabase/migrations/ \
                 | xargs -r -n1 basename | sort | tail -1)
          added=$(git diff --diff-filter=A --name-only HEAD~1 HEAD -- supabase/migrations/ \
                  | xargs -r -n1 basename | sort)
          bad=""
          for m in $added; do
            [ -z "$last" ] && break
            if [ "$m" \< "$last" ]; then bad="$bad $m"; fi
          done
          if [ -n "$bad" ]; then
            echo "::error::These migrations sort before '$last', which the project may already have run:$bad"
            echo "::error::Rename them to a later timestamp before they reach the project."
            exit 1
          fi
          echo "nothing added out of order (latest before this commit: ${last:-none})"
      - name: No migration alters or empties a table without a lock timeout
        run: |
          # `alter table` wants ACCESS EXCLUSIVE, and the moment it starts
          # waiting for one, every query behind it waits too -- so an ALTER on
          # a table the doors write to can stop the island dead for as long as
          # one open transaction holds a row. `lock_timeout` turns that from an
          # unbounded stall into a failed deploy, which is the cheaper of the
          # two. This looks only at statements: prose about an ALTER in a
          # comment starts with `--` or ` *`, never at the margin.
          #
          # `truncate` is in here because it wants the same lock and a deploy
          # died on one: the definitions snapshot empties the rulebook tables
          # to refill them, and it asked for `tile_def` at 13:00:30 UTC, which
          # is the minute the daily tree pass holds the woods open.
          added=$(git diff --diff-filter=AM --name-only HEAD~1 HEAD -- supabase/migrations/ || true)
          bad=""
          for m in $added; do
            [ -f "$m" ] || continue
            grep -Eiq '^[[:space:]]*((alter|drop)[[:space:]]+table|truncate[[:space:]])' "$m" || continue
            grep -q 'lock_timeout' "$m" || bad="$bad $m"
          done
          if [ -n "$bad" ]; then
            echo "::error::These migrations alter or empty a table with no lock timeout in front of it:$bad"
            echo "::error::Put \"set local lock_timeout = '3s';\" at the top of the file."
            exit 1
          fi
          echo "every migration that wants a table's lock bounds its wait"
          # And a wait it steps back from is still a wait, which is how the
          # *next* deploy died: `truncate a, b, c` takes its locks one at a
          # time and holds each while it asks for the next, so an island query
          # holding `tile_def` and wanting `item_def` closes a ring round it.
          # A deadlock is 40P01 and a timeout is 55P03; catching one and not
          # the other made a ring a dead deploy where a wait was a retry. If a
          # migration handles either, it handles both.
          bad=""
          for m in $added; do
            [ -f "$m" ] || continue
            grep -q 'lock_not_available' "$m" || continue
            grep -q 'deadlock_detected' "$m" || bad="$bad $m"
          done
          if [ -n "$bad" ]; then
            echo "::error::These migrations retry on a lock timeout but die on a deadlock:$bad"
            echo "::error::Catch both: \"exception when lock_not_available or deadlock_detected then\"."
            exit 1
          fi
          echo "and a migration that steps back from a wait steps back from a ring too"
      # `git diff` cannot see a file that is not tracked yet, and a fresh
      # `_defs.sql` is exactly that — so the old form of this check would have
      # let a brand new definitions migration through without noticing. Asking
      # `git status` about the whole directory catches both.
      - name: The definitions are still what the TypeScript says
        run: |
          npm run defs
          npm run db:bundle
          dirty=$(git status --porcelain supabase/migrations supabase/defs-state.sql supabase/all.sql)
          if [ -n "$dirty" ]; then
            echo "$dirty"
            echo "::error::The generated SQL is out of date. Run 'npm run defs' and 'npm run build', and commit what they write."
            exit 1
          fi
      # The live test is eight hundred lines that nothing typechecked: `tsconfig`
      # covered `src` and no more, so `smoke.ts` was first compiled by esbuild
      # inside the live job — after the migrations had been pushed to the real
      # project. A duplicate variable took a run down three minutes in.
      - name: The tests and tools that run outside a browser still compile
        run: npx tsc --noEmit -p tsconfig.node.json
      - name: Joining, refusing, digging, settling and who may write what
        run: supabase/test/run.sh
      - name: An island out through the wire format and back, corner by corner
        run: |
          npx esbuild supabase/test/landtrip.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/landtrip.mjs --log-level=error
          node node_modules/.cache/landtrip.mjs
      - name: The island's history lays onto land worked out as it goes
        run: |
          # The load-bearing half of a join, and the one the client cannot be
          # made to do without a network: replaying `tile_change` over a world
          # that is generated square by square as something asks for it. Get it
          # wrong and a tree felled an hour ago stands again.
          npx esbuild supabase/test/replay.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/replay.mjs --log-level=error
          node node_modules/.cache/replay.mjs
      - name: Where somebody has been survives the trip, and costs nothing to bring back
        run: |
          # The fog of war lived in `localStorage` and nowhere else, so a
          # refresh put a body in the middle of a black 4096 island. It is the
          # island's to keep now — and a join must not have to work out every
          # square anybody ever walked over in order to take it back.
          npx esbuild supabase/test/fog.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/fog.mjs --log-level=error
          node node_modules/.cache/fog.mjs
      - name: The island handed over is the island come back to
        run: |
          # Founding uploads what was rolled; joining works the ground out from
          # the seed and never downloads it. Two generators that disagreed
          # would put every player on ground the rules do not believe in, and
          # nothing else in this suite would notice.
          npx esbuild supabase/test/agree.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/agree.mjs --log-level=error
          node node_modules/.cache/agree.mjs
      - name: The ground a seed makes is the ground it made before
        run: |
          # The land travelled once, at founding, and Postgres has held that
          # copy ever since while every browser works the same ground out from
          # the seed. So the generator is a wire format with one message in it,
          # sent on founding day: change it and the ground moves under every
          # island already standing, silently, for tiles nobody has touched.
          # Measured against builds this repo shipped, one 256 window: c04881e
          # differs from today in 1367 of 65536 faces, 239 of them soft ground
          # the island would then refuse to let anybody pack.
          npx esbuild supabase/test/ground.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/ground.mjs --log-level=error
          node node_modules/.cache/ground.mjs
      - name: A bare face shows the rock it is made of
        run: |
          # Reported: ore and seams that break the surface drew as plain grey
          # rock. A tile dug bare gets the kind written into its data byte, on
          # both sides; a tile the generator lays down as rock does not — the
          # kind goes in the rock array and the byte stays at nought. The
          # drawing read the byte, so a thousand seams a window were invisible
          # while mining and prospecting knew about them all along.
          npx esbuild supabase/test/face.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/face.mjs --log-level=error
          node node_modules/.cache/face.mjs
      - name: The wild mix is the mix the weights ask for
        run: |
          # Reported as never having seen a mola. The stocker picked a tile,
          # rolled what stood up on it, and threw the roll away when the ground
          # was wrong for it — so a species came out as common as its weight
          # times the share of the island that suits it. A mola wants metal
          # under it, metal is a seventh of the ground, and a mola was one in
          # two hundred.
          npx esbuild supabase/test/wild.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/wild.mjs --log-level=error
          node node_modules/.cache/wild.mjs
      - name: A rack takes eight crates and says which spots are full
        run: |
          # Reported as no way to add crates to a crate shelf. The rules knew
          # about racks; the only way to reach the placing was the tile menu,
          # and a click on a tile with furniture on it opens the piece's menu
          # instead — so eight spots nobody could load, holding crates nobody
          # could click.
          npx esbuild supabase/test/rack.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/rack.mjs --log-level=error
          node node_modules/.cache/rack.mjs
      - name: A plan is marked out round its outline
        run: |
          # Reported as "there's currently nothing at all to show it's a plan".
          # Everything drawn for a building hangs off a wall or a floor, and a
          # fresh plan has neither, so a footprint was ground like any other
          # ground. It is marked out with stakes and string now, and this is
          # the rule that says where: the outline, once per border.
          npx esbuild supabase/test/plan.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/plan.mjs --log-level=error
          node node_modules/.cache/plan.mjs
      - name: The ground is the one on the chart
        run: |
          # And that the ground both generators agree on is the ground that was
          # drawn. They would agree just as contentedly on relief nobody asked
          # for: `land` and `depth` are multipliers on the chart's own range,
          # and if that range is not what they were written for, the shortfall
          # is quietly made up by the ridged noise.
          npx esbuild supabase/test/relief.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/relief.mjs --log-level=error
          node node_modules/.cache/relief.mjs
      - name: A thing in your hands crosses from the island whole
        run: |
          # Reported as "players cannot drink from water skins or fill them".
          # Both sides of that were right and the seam between them was not:
          # `play.ts` read six fields off an item row and dropped seven, so a
          # full skin arrived empty. Nothing measured the seam, which is why a
          # bug that broke seven features at once went unseen.
          npx esbuild supabase/test/pack.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/pack.mjs --log-level=error
          node node_modules/.cache/pack.mjs
      - name: What the island's answers say has happened to you
        run: |
          # Reported as "floating text only shows for climbing". The renderer
          # draws a floater off a skill gain or a hit, both of which come out
          # of the code that does the thing — and on an island the island does
          # it. Climbing is earned off your own feet, which is why it was the
          # one left. The change is worked out from what already arrives.
          npx esbuild supabase/test/felt.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/felt.mjs --log-level=error
          node node_modules/.cache/felt.mjs
      - name: What a rare thing is, and what a pass can turn one into
        run: |
          # Every rarity number is crossed from `RARITIES` into `rarity_def`,
          # so the two sides agree by construction — right up until somebody
          # writes one out again by hand. `improve_ceiling` did: it said a rare
          # thing could be bettered 4 past your skill while the table, the
          # browser and the island's own examine line all said 5. This puts the
          # two lists side by side, and rolls the ladder a quarter of a million
          # times to show a pass is one step up or none.
          npx esbuild supabase/test/rare.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/rare.mjs --log-level=error
          node node_modules/.cache/rare.mjs
      - name: Every goal the journal counts is a note the island writes
        run: |
          # Forty-six of the journal's eighty-five goals count things done, and
          # every one of those counts was written by a browser performer — so on
          # an island not one of them could ever tick, and nothing said so. The
          # notes are the island's now, and this is what says when one goes
          # missing: a goal whose key nobody sets looks exactly like a goal
          # nobody has got round to.
          npx esbuild supabase/test/writ.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/writ.mjs --log-level=error
          node node_modules/.cache/writ.mjs
      - name: Where the water starts, and where a pick stops
        run: |
          # Reported as a copper vein that would not be mined, with "You cannot
          # mine below the water level" and no water drawn on it. The island's
          # half of that is measured in island.sql against the rules; this is
          # the browser's half — that water is drawn from the first unit below
          # the line, so one dug corner is already a puddle, and that the
          # allowance both sides read is one number and not two.
          npx esbuild supabase/test/tide.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/tide.mjs --log-level=error
          node node_modules/.cache/tide.mjs
      - name: The land read is the same island as the history replayed
        run: |
          # Two roads to one place, which is the thing this island has been
          # bitten by more than any other. A join used to work the island out
          # from its seed and lay every row of `tile_change` over it, which
          # costs the area that has ever been worked and climbs for ever; it
          # reads the land itself now, which costs what the square is. Both are
          # driven here over one island with the same digging done to it and
          # compared byte for byte — heights, soil, tiles, data and rock — and
          # so is the seam that makes the swap safe: the cursor the window is
          # read at is taken before the land, so a spadeful turned in between
          # is replayed as well as read rather than lost between the two.
          npx esbuild supabase/test/window.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/window.mjs --log-level=error
          node node_modules/.cache/window.mjs
      - name: What a ground read is allowed to forget
        run: |
          # `rpc_ground` answers in two halves and `sawGround` has two kinds of
          # key: ones the answer always carries, which may be cleared and
          # replaced, and ones it carries only on the reconcile, which may not.
          # Getting that wrong does not look like a bug in the reading — it
          # looks like the thing itself flickering, once a second, for ever.
          # It has been got wrong twice in that one function now, for the
          # settlements and then for the crops, so it is a test rather than a
          # comment: `undefined` is "nothing said about this" and an empty list
          # is "nothing is there", and they are not the same answer.
          npx esbuild supabase/test/field.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/field.mjs --log-level=error
          node node_modules/.cache/field.mjs

      - name: What is lying on the ground reaches a browser
        run: |
          # The ground answer never carried a thing lying on the grass, and the
          # browser's map of the ground was only its own rules' to write, which
          # do not run on an island: a corpse was in Postgres and drawn by
          # nobody. The answer carries `lying` now, and this hands `sawGround`
          # one as the island sends it.
          npx esbuild supabase/test/lying.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/lying.mjs --log-level=error
          node node_modules/.cache/lying.mjs

      - name: Concrete goes on plain rock, never on a seam
        run: |
          # A corner holds up four tiles, and a vein under any of them raised
          # with concrete would be ore for ever. The browser's door, asked about
          # a shelf of bare rock with a vein, the coal, and plain rock under it.
          npx esbuild supabase/test/seam.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/seam.mjs --log-level=error
          node node_modules/.cache/seam.mjs

      - name: You turn on whatever bites you
        run: |
          # A bite used to mark you and hurt you and that was all. Bitten in a
          # game of its own, a body swings at the thing with what it had been
          # doing first in line behind it; a second bite changes nothing; a nip
          # from a tame one is no fight.
          npx esbuild supabase/test/turn.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/turn.mjs --log-level=error
          node node_modules/.cache/turn.mjs

      - name: A window that draws the trades, and the answers it is drawn from
        run: |
          # Five doors existed for a day with nothing drawing them. The trades
          # window draws them now and works out none of it for itself, which
          # makes the shape of the answer a contract: a field renamed on the
          # island is a blank card in the browser, and nothing else in the
          # suite would say so. This asks that every field the panel reads is
          # on every card, that the two sides describe all twenty-four trades
          # identically, and that the three write-doors do what the buttons
          # promise -- take a trade of each, buy a node, and find a rite on the
          # fighting one and none on the craft one.
          npx esbuild supabase/test/trades.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/trades.mjs --log-level=error
          node node_modules/.cache/trades.mjs

      - name: Two bins, and the line drawn between them
        run: |
          # Ore, logs, dirt, shards and wool go in the raw bin; a plank, a
          # brick, a lump, a hatchet and wheat are refused in the island's
          # words. The craft material bin is its opposite number off the same
          # bill, and takes exactly what the other refuses -- so the pair of
          # them partitions the materials: nothing goes in both, every material
          # goes in one, and the split is forty-one raw to eighty worked on
          # both sides. It is measured in kilograms rather than counted, which
          # the island agrees to the unit: 250,000 nails, 1,250 planks or 416
          # timbers in the same bin.
          npx esbuild supabase/test/bins.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/bins.mjs --log-level=error
          node node_modules/.cache/bins.mjs

      - name: An anvil off the island keeps its metal
        run: |
          # The island hands an anvil's metal in `sub`, as its own rules read
          # it. A copper anvil set down on an island came to a browser as an
          # iron one; now it is the anvil it was poured as.
          npx esbuild supabase/test/anvil.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/anvil.mjs --log-level=error
          node node_modules/.cache/anvil.mjs

      - name: What the ground says about a cut it will not take
        run: |
          # A slope refusal carries its numbers on both sides, ground inside
          # somebody else's stake is refused, flattening steps round a corner
          # of bare rock instead of stopping at it, a level taken stops a run
          # of goes on the mark, and a spadeful comes out of the crate.
          npx esbuild supabase/test/cut.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/cut.mjs --log-level=error
          node node_modules/.cache/cut.mjs

      - name: What a go teaches the body, and what it does not
        run: |
          # Eating, drinking and carrying things about are not work: both sides
          # name the same twenty-five jobs that teach the body nothing, and a
          # loaf eaten in a game of its own leaves every stat where it was.
          npx esbuild supabase/test/body.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/body.mjs --log-level=error
          node node_modules/.cache/body.mjs
      - name: Nothing walks under half again what it can carry
        run: |
          # Asked for: "when inventory is above 150% cap, movement speed
          # becomes 0". What a body carries was the browser's own business, and
          # a stop only one side holds is a stop the other can decline — so the
          # two numbers behind it are generated into the island and this puts
          # the browser's to them before loading a body until it cannot walk.
          npx esbuild supabase/test/load.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/load.mjs --log-level=error
          node node_modules/.cache/load.mjs
      - name: A field gets sown, and a load goes where there is room for it
        run: |
          # Reported: "seavic isn't planting seeds that are in crates on deed,
          # and rabba are just overdelivering to the full deed crate instead of
          # bringing anything to the empty crate." Both were the island being
          # thinner than the browser, so both questions go to both sides over
          # the same settlement, the same field and the same seed.
          npx esbuild supabase/test/sow.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/sow.mjs --log-level=error
          node node_modules/.cache/sow.mjs
      - name: The store you aimed at is the store it goes in
        run: |
          # Reported off a crate rack: "trying to place any items in any of the
          # pine crates gives an error that the maple crate is full". Putting a
          # thing away never said which container, so it went into whichever
          # stood nearest — which on a rack of eight is always the same one.
          npx esbuild supabase/test/into.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/into.mjs --log-level=error
          node node_modules/.cache/into.mjs
      - name: What fits goes in, and the rest stays in your pack
        run: |
          # Asked for: "when trying to put 48 items in a container that has
          # room for 13, deposit 13 and reject the 35." It was all or nothing,
          # so the way through was to count the difference yourself and split
          # the stack by hand.
          npx esbuild supabase/test/part.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/part.mjs --log-level=error
          node node_modules/.cache/part.mjs
      - name: Which storey, which side, and how many to go
        run: |
          # Reported: "cant plan roof on when conditions are met. make sure
          # that doors and window walls etc count as elligible walls if
          # completed." They do; what was wrong was a refusal that named
          # neither the storey it meant nor the side that was short.
          npx esbuild supabase/test/roof.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/roof.mjs --log-level=error
          node node_modules/.cache/roof.mjs
      - name: A wall is a box, and the face you see is the one you are standing on
        run: |
          # Reported: "walls are paper thin and have no character." A wall is a
          # box now rather than a curtain, and which of its two faces is drawn
          # is worked out per wall from the camera — one line that, with the
          # sign backwards, would put every wall on the island half a tile out.
          npx esbuild supabase/test/thick.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/thick.mjs --log-level=error
          node node_modules/.cache/thick.mjs
      - name: An archway, in each material
        run: |
          # Asked for: "add a new doorway type, Arch, in each material." A type
          # is offered in every material by construction, so what is worth
          # checking is that both sides charge the same for it in all twelve —
          # and that it hangs nothing, which is the whole of what it is.
          npx esbuild supabase/test/arch.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/arch.mjs --log-level=error
          node node_modules/.cache/arch.mjs
      - name: A go that missed still teaches you, and says so
        run: |
          # Reported: "i'm not getting any smelting experience for failed
          # smelting." The experience was there; nobody was saying so. The line
          # was written by hand at the end of a performer and a failed craft
          # returned before reaching it, so this asks both halves — what a miss
          # is worth against a landing, and that the same sentence comes out of
          # both sides for the same ruined crucible.
          npx esbuild supabase/test/taught.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/taught.mjs --log-level=error
          node node_modules/.cache/taught.mjs
      - name: A foundation is the same slab on both sides
        run: |
          # Concrete foundations: level ground poured into a slope, leaving the
          # slope alone. Two numbers decide everything about one — what it
          # costs, which is the hole it fills priced by the step, and how deep
          # the deepest part of that pour is, which is what it asks of your
          # masonry — and both are worked out twice, once a side. So the same
          # tiles are put to both and the answers held against each other.
          npx esbuild supabase/test/slab.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/slab.mjs --log-level=error
          node node_modules/.cache/slab.mjs
      - name: Every tool can be made a second time
        run: |
          # Reported: "there does not seem to be a way to make a chisel / mould
          # for chisel." Four of the ten tools you come ashore with could never
          # be made again by anybody, and every tool wears — so each was a
          # countdown, and the chisel's ran out first because the whole of
          # Stonework wants one. Nothing was wrong in any one file; a tool
          # simply had no row anywhere, which is hard to notice by reading. So
          # it is counted: everything that can put a tool in your hands is
          # walked, and anything left over is a tool nobody can replace.
          npx esbuild supabase/test/tools.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/tools.mjs --log-level=error
          node node_modules/.cache/tools.mjs
      - name: What the bench gives back, and what a click is worth
        run: |
          # Three reports in one message, all about the moment a go ends.
          # "free body control gains from examining as well as keeping/putting
          # back items" — thirty-two jobs that cost no wind and take no time
          # were paying a body for them. "my bronze anvil isn't letting me
          # improve it saying that i need bronze, but i have 37 bronze lumps on
          # me ... actually it looks like everything i try to improve is
          # telling me that" — the island looked for the metal in a column a
          # lump does not use, so nothing in anybody's pack was ever the right
          # material. "i've made a lot of whetstones and haven't managed
          # anything other than QL 1" — a tool roll that missed paid nothing at
          # all instead of paying what the tool was worth. Each is measured
          # here rather than eyeballed, and the middle one is put to the island
          # too, because that is the side it was reported from.
          npx esbuild supabase/test/bench.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/bench.mjs --log-level=error
          node node_modules/.cache/bench.mjs
      - name: A storey stands on what is under it
        run: |
          # A building could be ten storeys of logs: nothing anywhere asked
          # what the stuff would stand, so twelve materials differed only in
          # what they cost and what colour they came out. Each says now how
          # many storeys of it hold up, the shortest material in a building
          # caps the whole of it, nothing heavier goes over something lighter,
          # and raising a storey takes ten of the trade below for every one
          # above the first. The cart half is the browser's alone, since the
          # island has never had an opinion about where wheels may go.
          npx esbuild supabase/test/storey.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/storey.mjs --log-level=error
          node node_modules/.cache/storey.mjs
      - name: A room with walls round it and a roof over it
        run: |
          # A roof cost half a wall, took the same work, and did nothing at
          # all: what you left on the floor of a finished house rotted at the
          # rate it rotted at in a field, and the only thing on the island
          # that ever sheltered anything was a sack. There are rooms now —
          # everywhere you reach without crossing a wall — and a room walled
          # all round with something over it is indoors, worth a tenth of the
          # rot and a third again of a night's sleep. The sweep never charged
          # for a deed either, which the browser always had; both tenths are
          # one function now. And a roof has a shape: gable, hip or a flat
          # deck you can walk out onto.
          npx esbuild supabase/test/indoors.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/indoors.mjs --log-level=error
          node node_modules/.cache/indoors.mjs
      - name: Glass in the window, and a colour on the wall
        run: |
          # Every window on the island has had glass in it since the first day
          # and the glass was never made, never paid for and never once lit: a
          # window wall cost three quarters of a solid one and nothing besides,
          # so glazing was free and a window was cheaper than the wall it was
          # cut into. And everything here comes out the colour of what it was
          # made of, so a street of twelve materials is a street of twelve
          # colours; paint is the first thing a builder gets to choose.
          npx esbuild supabase/test/glazed.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/glazed.mjs --log-level=error
          node node_modules/.cache/glazed.mjs
      - name: The pile on the site, and a bridge to a storey
        run: |
          # A builder carried everything — twenty-four logs for six walls, at
          # what a log weighs — while the crate they were tipped into stood on
          # the very tile being worked. And a bridge's ends wanted a bank or a
          # poured slab, both of them ground, so two towers a tile apart were
          # a staircase down, a walk across the yard and a staircase up.
          npx esbuild supabase/test/site.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/site.mjs --log-level=error
          node node_modules/.cache/site.mjs
      - name: Eight ways round, not two
        run: |
          # Reported: "when changing camera angles models just twist in
          # place." Every animal is drawn in profile and the only thing the
          # view could do with that was mirror it, so a beast heading north
          # and one heading east were the same picture and walking the camera
          # round one showed you the same flank. What the angle decides now is
          # how much of the length you are looking along, with the far end
          # riding up the screen because it is further away.
          #
          # Furniture had the same fault in a different shape: a piece is an
          # iso box and every drawing put its front on the two faces nearest
          # you, so a wardrobe showed its doors from everywhere and had no
          # back. Which faces you have is taken from the relative turn now.
          #
          # Both failures are silent — a sign backwards and every beast on the
          # island walks backwards — so the eight are counted rather than
          # eyeballed.
          npx esbuild supabase/test/turned.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/turned.mjs --log-level=error
          node node_modules/.cache/turned.mjs
      - name: The island heard from where the camera is standing
        run: |
          # There was no sound in this game at all — no AudioContext anywhere
          # in the source — so a pickaxe in marble and a needle in linen were
          # both silence. Everything is synthesised now, and placed in the mix
          # off the screen rather than out of the world, so the camera is the
          # ear and what you have looked away from goes quiet.
          #
          # Whether any of it sounds good is what ears are for. What is
          # measured here is that every one of the three hundred and
          # ninety-three jobs that costs time or wind is either given a noise
          # or named as making none — a job missing from the tables would be
          # silent, and silently — and that the mix is the shape it claims:
          # centre loud, either side panned opposite ways, and far enough off
          # the view not started at all.
          npx esbuild supabase/test/heard.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/heard.mjs --log-level=error
          node node_modules/.cache/heard.mjs
      - name: A walk puts the work down, and a piece can be asked for a quality
        run: |
          # Walking anywhere used to throw the whole queue away — moveTo
          # cancelled, rpc_cancel emptied act_queue — so a builder with four
          # walls lined up who stepped to the woodpile came back to an empty
          # head. It holds now: the job in hand goes back to the front and
          # nothing restarts itself, because being dragged back across a yard
          # you crossed on purpose is worse than losing the list.
          #
          # And a piece can be asked for a quality instead of a count of
          # passes, which is the wrong unit: what a pass is worth falls away
          # as the piece gets better. That is one refusal on each side, and
          # the two are compared here word for word, because a ceiling the
          # browser honours and the island does not is a button that works
          # until it doesn't.
          npx esbuild supabase/test/hands.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/hands.mjs --log-level=error
          node node_modules/.cache/hands.mjs
      - name: A run is not a fast walk, and a wall knows whose room it is in
        run: |
          # walkPhase advances quicker when you move quicker, so a horse at a
          # gallop took a body's steps — more of them a second, the same reach,
          # never leaving the ground. Three things separate a run from a walk
          # and all three now come off one number read from the ground a thing
          # actually covers.
          #
          # The load-bearing check is the first: at a walk every one of the
          # fifty-two drawings is what it was, bit for bit. Only a run is new.
          # And the sign of the lean, because getting it backwards would have
          # everything on the island sprinting while leaning away from where
          # it is going — obvious in a picture, invisible in a diff.
          #
          # Plus the cutaway, which used to fade the near walls of the whole
          # building you stood in, the far bedroom's included.
          npx esbuild supabase/test/paced.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/paced.mjs --log-level=error
          node node_modules/.cache/paced.mjs
      - name: Somebody coming ashore is told what to do and what decides it
        run: |
          # There is no tutorial on this island and never has been. The
          # journal is eighty-five goals all on screen at once, which is a
          # good list and a poor answer to "what now": a list says everything
          # at the same volume. The first chapter is read out one goal at a
          # time now, in as many words as it takes, and stands down for good
          # once the stake is in the ground.
          #
          # And one rule is said out loud that never was: your skill is the
          # ceiling and your tool decides how often you reach it. That was
          # reported as the game being broken — "i've made a lot of whetstones
          # and haven't managed anything other than QL 1" — which is what a
          # rule looks like from outside when nobody has said it.
          npx esbuild supabase/test/ashore.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/ashore.mjs --log-level=error
          node node_modules/.cache/ashore.mjs
      - name: A herd keeps together, and a hunter keeps to its country
        run: |
          # Nothing kept a wild animal anywhere: a wander target was drawn a
          # tile and a half from wherever it last got to, for ever, so an
          # island's wildlife had no geography at all. Everything wild has a
          # home now, and a herd is not a list anywhere — it is a shared home,
          # taken from the nearest of its own kind at the moment it arrives.
          #
          # And the leash was tied where a chase began, which is right for a
          # hunter you walked in on and wrong for one that had already
          # strayed: that one would take you thirty tiles further still. Both
          # measures are asked now and the first to run out ends it.
          #
          # Put to both sides, because the wild is thought about on whichever
          # of them is doing the thinking, and a herd that holds together in a
          # browser and scatters on an island is worse than no herd at all.
          npx esbuild supabase/test/range.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/range.mjs --log-level=error
          node node_modules/.cache/range.mjs
      - name: What you are on a settlement, and what opens for you
        run: |
          # `deed_member` was a flat list: in or out, and everybody in it
          # could dig up the gardens, empty the stores and pull the walls
          # down. Four ranks now, and the shaping question goes through
          # `may_shape` rather than "are you on the roll".
          #
          # And everything anybody built was open to everybody. A padlock is
          # forged with no key and cuts one when it is fitted; the number they
          # share is the padlock's own id. The one way back in is the ground —
          # the founder of the settlement a store stands on — because a game
          # where losing a small item costs you a building is a game nobody
          # enjoys.
          #
          # Both refusals are compared word for word across the two sides.
          # And "two people on one job", which I suggested was missing and is
          # not, is measured so it stays true.
          npx esbuild supabase/test/ranks.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/ranks.mjs --log-level=error
          node node_modules/.cache/ranks.mjs
      - name: Coins that buy something, three ways
        run: |
          # Coins have existed since there was an anvil to strike them on and
          # have never bought anything, because there was nothing to buy them
          # with and nobody to buy from. One number settles the money — a gold
          # coin is worth ten silver — and three ways goods change hands,
          # because they answer three different questions: a deal is two
          # people standing together, a stall is for when you are not there,
          # and a parcel is for when neither of you is.
          #
          # The arithmetic is checked on both sides, including that change
          # comes back in the fewest coins and that a purse which cannot cover
          # a price pays nothing at all rather than part of it. And that the
          # two functions which mint and destroy coins are the island's alone:
          # a door onto either would be a door onto making money.
          npx esbuild supabase/test/trade.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/trade.mjs --log-level=error
          node node_modules/.cache/trade.mjs
      - name: Everybody you may write to, each of them once
        run: |
          # Friends, the people off your own land, and anybody who has written
          # to you are three questions with the same answers in them, and the
          # Letters tab laid them end to end: a friend you had also invited
          # home was two rows of the same person. The Friends tab, three lines
          # away in the same file, had always folded them through a `Set`. So
          # the rule is a function now rather than a line inside the drawing,
          # and this asks it the question the screenshot asked.
          npx esbuild supabase/test/letters.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/letters.mjs --log-level=error
          node node_modules/.cache/letters.mjs
      - name: What Look says is coming for a tree, the same on both sides
        run: |
          # "The woods turn over in 9 hours, and it will be shrivelled. Prune
          # it to keep it." is one sentence written twice, once a side. A solo
          # world hears the browser's and an island the island's, and a player
          # who plays both should never be able to tell which — so every stage
          # of the age table is put to both, and the hour-words at their
          # thresholds, where a sentence turns.
          npx esbuild supabase/test/outlook.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/outlook.mjs --log-level=error
          node node_modules/.cache/outlook.mjs
      - name: A furnace off the island reads the way one you built yourself does
        run: |
          # The island writes a finished piece as {def, ql, count, extra} and a
          # job as {makes, left, total, ql}; the browser's item has an id and
          # its job an item. The list was taken as it came, cast and not looked
          # at, and a right-click on a smelter with a finished lump in it threw
          # out of the click handler and locked the input. So a smelter and a
          # kiln are handed over exactly as the island hands them, and asked
          # what the menu asks.
          npx esbuild supabase/test/furnace.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/furnace.mjs --log-level=error
          node node_modules/.cache/furnace.mjs
      - name: A slope you can stand on is the same slope on both sides
        run: |
          # The standing cap is written twice — `standsOn` and `standSlope` in
          # the browser, `walk_share` and `creature_tile_ok` on the island —
          # so the same dug ground is put to both: a tile seventy steep and
          # one fifty, a walker at climbing nought and then fifty asking to
          # step off the flat into each, and a wild thing asked whether it
          # would stand there.
          npx esbuild supabase/test/stand.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/stand.mjs --log-level=error
          node node_modules/.cache/stand.mjs

      - name: The crafting window offers a choice of wood
        run: |
          # Asked for: a pack with oak and pine in it, and a row that lets you
          # say which the piece is to be made of. `materialChoices` lists the
          # woods carried for the recipe, `recipeStatus` takes the one the row
          # is set to, the clicked stack still wins over it, and the thing
          # made comes out of the wood the row said.
          npx esbuild supabase/test/wood.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/wood.mjs --log-level=error
          node node_modules/.cache/wood.mjs

      - name: Eight more trees that bear, held to their islands
        run: |
          # The species of a tree is the low nibble and the top bit of its tile
          # byte now, and every byte from before has to read as it did; the
          # chart's regions each grow their own kinds and never another's; an
          # island of your own grows them all.
          npx esbuild supabase/test/orchard.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/orchard.mjs --log-level=error
          node node_modules/.cache/orchard.mjs

      - name: Thirty traits for a fight, each in four grades
        run: |
          # Fighting blood is a name and a grade rolled for it: thirty names in
          # all four tiers, a share of the wild's rolls, never two grades of one
          # name on an animal, and a line that climbs a grade of its own name.
          npx esbuild supabase/test/blood.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/blood.mjs --log-level=error
          node node_modules/.cache/blood.mjs

      - name: A quarter of the cycle dark, on both sides
        run: |
          # "On the full day cycle, it shouldn't be half night half day, it
          # should be 3/4 day and 1/4 night." It was forty-two per cent dark,
          # which reads as half. Dawn moves to three and dusk to nine, so
          # eighteen hours sit between them with noon exactly in the middle.
          #
          # The second half of this is why it was possible to get wrong: the
          # island's `darkness` held 7, 19, 21 and 5 written out by hand, the
          # same bug `hour_of_day` had when it held 1440. It reads the
          # generated `dawn_hour()` and `dusk_hour()` now, and the whole day is
          # asked of both sides in three-minute steps.
          npx esbuild supabase/test/dark.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/dark.mjs --log-level=error
          node node_modules/.cache/dark.mjs

      - name: Seed in the crate, and one you keep put down in one action
        run: |
          # "Seavics also move seeds to storage if not using them when working
          # deed": the seed from a harvest went into the browser's `pouch`,
          # which is not a thing a person can open, and into the furrow on the
          # island, where it lay under the next crop for ever. It is a load
          # like any other now on both sides, and this follows it to the crate.
          #
          # And "add a cull option on tamed wildermon to kill them with one
          # action", which until now meant swinging at your own livestock until
          # it stopped. Same carcass, one action, and a refusal for anything
          # wild or anything across the island.
          npx esbuild supabase/test/cull.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/cull.mjs --log-level=error
          node node_modules/.cache/cull.mjs

      - name: A shore face is work and the sea floor is not
        run: |
          # "Allow mola to mine ore, seams and rock at up to -10 water level
          # just like players." Three rules were in the way and only one of
          # them was about depth. The browser asked whether a body could stand
          # on the tile, which allows one unit of water; this island asked
          # nothing at all, so a worker here would set about the sea floor at
          # forty fathoms; and both sides had `rock_height > 1`, which reads
          # as "is there rock here" and is really the waterline again, so no
          # depth allowance anywhere else could have helped.
          #
          # The person's rule now, on both: ten units of water, the same floor
          # under the pick, a bank on any of the eight sides to swing from,
          # and a face too deep to stand on worked from that bank.
          npx esbuild supabase/test/shore.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/shore.mjs --log-level=error
          node node_modules/.cache/shore.mjs

      - name: Who pays for the wildlife
        run: |
          # "Something is severely delaying server responses." It was this: a
          # block of country is stocked the first time anybody walks into it,
          # and that used to happen inside `rpc_move` — the call a walking
          # browser makes constantly — so the walker stood still for a second
          # and a half. PostgREST answers eight at a time, so three people
          # crossing fresh country held three of those eight and everything
          # else queued behind them.
          #
          # It is on `stock_tick` now, a clock of its own with a lock of its
          # own, putting out the block underfoot and the eight around it so
          # the country is ready before anybody arrives. The assertion that
          # matters here is the exact one: walk thirty steps across a block
          # never stocked and nothing may appear. That is what fails if
          # stocking is ever put back on a request path.
          #
          # The density is pinned here too, because a constant changed in
          # TypeScript once made the server five times slower with every test
          # still green.
          npx esbuild supabase/test/stock.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/stock.mjs --log-level=error
          node node_modules/.cache/stock.mjs

      - name: A spadeful you could not put down
        run: |
          # "Allow dropping dirt on the ground as a pile." Dirt was the one
          # thing in the game a person could pick up and then not put back
          # down: both sides refused it by name, on the reasoning that dirt
          # belongs in a hole. It does, and it also belongs in a heap beside
          # the hole while you decide which hole.
          npx esbuild supabase/test/heap.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/heap.mjs --log-level=error
          node node_modules/.cache/heap.mjs

      - name: A function the planner could not see into
        run: |
          # Postgres folds a `language sql` scalar function into its caller
          # and refuses when the body holds a sublink. `max_health` held one,
          # so every creature in every `rpc_creatures` answer paid a whole
          # function call with the entire row handed in as a composite — and
          # handed in again to `beast_mul` underneath. This pins both the
          # property that makes them fold and the numbers they answer.
          npx esbuild supabase/test/folded.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/folded.mjs --log-level=error
          node node_modules/.cache/folded.mjs

      - name: The woods turn over once, at dawn, and finish
        run: |
          # `tree-tick` was wound at ten-minute intervals against a job with
          # one day's work in it, and the one go a day with work to do was
          # being killed by the statement timeout. The reason is a cliff that
          # opens on the fourth line of an island: a four-kilobyte line is
          # stored packed, `select into` copies it packed, and once plpgsql
          # keeps the plan every `get_byte` unpacks the whole line again to
          # read one byte. Measured here rather than asserted, because it is
          # one character away from coming back.
          npx esbuild supabase/test/dawn.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/dawn.mjs --log-level=error
          node node_modules/.cache/dawn.mjs

      - name: One pile and not six
        run: |
          # Reported off a screenshot of a pack holding six separate piles of
          # cotton seeds. `give` had always folded a harvest into a matching
          # stack; the eight statements that *move* a row into a pack folded
          # nothing, so every one of them started a rival pile. One rule now,
          # `stack_key`, with `sameStack` in the browser saying the same thing
          # — which this asks pair by pair rather than trusting.
          npx esbuild supabase/test/pile.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/pile.mjs --log-level=error
          node node_modules/.cache/pile.mjs

      - name: A worker that can reach the larder
        run: |
          # `worker_feed` looked in crates and nowhere else, so a wildermon
          # could stand beside a larder holding a hundred and fifty of exactly
          # what it eats and starve. The browser never had that fault. This
          # asks both halves: every store on the deed is somewhere to look,
          # and a locked stack, priced stock, post and goods under a deal are
          # not lunch — none of which were checked before.
          npx esbuild supabase/test/larder.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/larder.mjs --log-level=error
          node node_modules/.cache/larder.mjs

      - name: Fourteen trades, and one of them yours
        run: |
          # Sixty-one skills and no way of saying what you *are*. A class is
          # that: fourteen craft trades, one locked in, opening at fifty in any
          # skill it covers, free the first time and 500 silver to swap. This
          # asks both sides for the list and adds it up — every craft skill in
          # exactly one trade, and what is left over exactly the twenty-two the
          # combat trades will be drawn from, so no skill gates two cards.
          npx esbuild supabase/test/craft.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/craft.mjs --log-level=error
          node node_modules/.cache/craft.mjs

      - name: Nine nodes to a trade
        run: |
          # Three columns of three per trade, two points at fifty and twelve at
          # a hundred — so twelve buys two whole columns and two over, never
          # all three. Both sides are asked for the 126 nodes field for field
          # and for all four refusal sentences, and then each of the four
          # channels is measured at the site that reads it: skill_mult,
          # spend_wind, act_duration, and a bench and a mend with the roll
          # taken out, so the ratio that comes back is the node and nothing
          # else. A channel nothing is wired to is nine dead nodes the browser
          # cannot see, so that is counted too.
          npx esbuild supabase/test/tree.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/tree.mjs --log-level=error
          node node_modules/.cache/tree.mjs

      - name: Seven ways to fight, and a rite for each
        run: |
          # Three melee, two ranged, a healer and one that fights with what
          # fights beside it. Five new channels, every one of them a line that
          # already decided its number — weapon_damage, hit_chance,
          # hurt_player, wound_close, attack_of — plus hands and wind, which
          # only wanted act_scope to call a swing by the thing in your hand
          # rather than by `fighting`. And the rite, which is a node with an
          # hour on it: same channels, same scope, same fold, so there is no
          # second machinery for a number to disagree with itself in.
          npx esbuild supabase/test/fight.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/fight.mjs --log-level=error
          node node_modules/.cache/fight.mjs

      - name: A stone, and what you can get out of it
        run: |
          # The arcane, which has no mana in it. A focus is a cut gem in a
          # silver claw and every number the system needs was already on the
          # item: the kind, the cut, the find, and how much is left. A stone
          # worn through crumbles down the same path that takes a rotten
          # haunch off the ground. This asks both sides for the three schools
          # and six spells, compares the four pieces of arithmetic fed the
          # same inputs, and lands all three effects — a burn, a hold and a
          # skin — including that a skin spent against a blow stays spent.
          npx esbuild supabase/test/arcane.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/arcane.mjs --log-level=error
          node node_modules/.cache/arcane.mjs

      - name: What is lying about, going off where it lies
        run: |
          # ground_sweep rewrote every thing on an island's ground once a
          # second — 95 microseconds a row, whether anything had changed or
          # not, which was the whole of a world round on a busy island. It is
          # charged in steps now, and the claim that makes that safe is that
          # the elapsed terms telescope: two hours then one is three hours.
          # That is asked here to the last bit, along with the cap, the order,
          # and — in buffers rather than milliseconds, so it means the same on
          # a slow runner — that a quiet round does not read the ground.
          npx esbuild supabase/test/rot.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/rot.mjs --log-level=error
          node node_modules/.cache/rot.mjs

  migrate:
    name: Push the migrations to the project
    if: github.event_name == 'workflow_dispatch' && inputs.live
    needs: rules
    runs-on: ubuntu-latest
    environment: AI
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        id: cli
        continue-on-error: true
        with:
          version: latest
        env:
          # The action resolves "latest" through the GitHub API, unauthenticated
          # from a shared runner address, and a run failed with "rate limit
          # exceeded" before it had done anything at all. A token costs nothing
          # and takes the anonymous quota out of the path.
          GITHUB_TOKEN: ${{ github.token }}
      - name: Get the CLI another way if that did not work
        if: steps.cli.outcome != 'success'
        run: |
          # npm rather than the GitHub API: the same binary, fetched from a
          # registry that is not counting anonymous requests per address.
          echo "::warning::supabase/setup-cli failed; installing from npm instead."
          npm i -g supabase
          supabase --version
      - name: Link and push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'glebtboagnafcgwjjvfy' }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Set SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD in the 'supabase' environment."
            exit 1
          fi
          supabase --version
          supabase link --project-ref "$PROJECT_REF"
          # What is about to change, before it changes.
          supabase migration list --linked
          # `--include-all` because a migration can be *added* out of order
          # even though none is ever edited or renamed: the generated
          # definitions are stamped with the wall clock and the hand-written
          # ones are stamped by hand, and the two clocks are not the same
          # clock. The guard in `rules` is what makes this safe — it refuses a
          # commit that adds a migration sorting before one already in the
          # tree, so anything the CLI would slot in early has been checked.
          supabase db push --include-all
          supabase migration list --linked
      - name: What is alive on each island
        # Asked for: "what is the crescent island mob count currently?" — a
        # question nothing in the run could answer, because this is the only
        # job with a line to the project. Reported rather than checked: a count
        # is news and not a rule, so it never fails the run, and the island is
        # only read from.
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'glebtboagnafcgwjjvfy' }}
        run: |
          # Say what this CLI can actually do before asking it anything: the
          # name of the subcommand that runs SQL has moved between versions,
          # and the log of a failed guess is worth more than the guess.
          supabase --version
          supabase db --help || true
          # Wild is the only kind the target counts; anything tamed, penned or
          # stored is on top of it. And the island is stocked a block at a time
          # as people walk into it, so `blocks` is how much of it has ever been
          # visited, which is the other half of why a count is what it is.
          #
          # `ceiling` asks `creature_target()` rather than working the same sum
          # out again here. The first cut of this step carried its own copy of
          # the formula and was wrong within the hour, the moment the density
          # was tripled: it went on reporting the old ceiling while the island
          # stocked to the new one. A number worth printing is worth asking for.
          #
          # And the ref and the date, because four of the islands on the
          # project are called Wildermon and a row nobody can tell from another
          # row answers nothing.
          SQL=$(cat <<'EOSQL'
          select w.name as island,
                 left(w.id::text, 8) as ref,
                 to_char(w.made_at, 'MM-DD HH24:MI') as made,
                 w.size,
                 count(*) filter (where c.mode = 'wild') as wild,
                 count(*) filter (where c.mode is not null and c.mode <> 'wild') as kept,
                 (select count(*) from world_stocked s where s.world_id = w.id) as blocks,
                 creature_target(w.id) as ceiling
            from world w
            left join creature c on c.world_id = w.id
           group by w.id, w.name, w.size, w.made_at
           order by w.made_at, w.name;
          EOSQL
          )
          # Whichever of these this version answers to. None of them is allowed
          # to take the run down with it.
          supabase db query --linked "$SQL" \
            || printf '%s\n' "$SQL" | supabase db query --linked \
            || PGPASSWORD="$SUPABASE_DB_PASSWORD" psql -v ON_ERROR_STOP=1 \
                 "postgresql://postgres:$SUPABASE_DB_PASSWORD@db.$PROJECT_REF.supabase.co:5432/postgres" \
                 -c "$SQL" \
            || echo "::warning::Could not read the island; see the CLI's own help above."
          # And what rulebook the island is actually holding, which no run has
          # ever shown either.
          #
          # A green "Link and push" says the files applied. It does not say what
          # is in the tables afterwards, and the difference matters: the
          # definitions migrations empty the rulebook and fill it again, and the
          # one failure mode that would be silent is filling a table that was
          # never emptied. A count that has doubled says so at a glance.
          #
          # It is also the only way to see from a run whether the thing that was
          # just deployed is there. Four deploys in a row failed this afternoon
          # and the only way to know how far each had got was to read the error.
          RULES=$(cat <<'EOSQL'
          select (select count(*) from class_def) as trades,
                 (select count(*) from class_node) as nodes,
                 (select count(*) from rite_def) as rites,
                 (select count(*) from school_def) as schools,
                 (select count(*) from spell_def) as spells,
                 (select count(*) from item_def) as things,
                 (select count(*) from item_def where raw) as raw_mats,
                 (select count(*) from recipe) as recipes,
                 (select count(*) from furniture_def) as pieces,
                 (select coalesce(max(heft)::text, 'none')
                    from furniture_def where crafted) as craft_bin_kg;
          EOSQL
          )
          supabase db query --linked "$RULES" \
            || printf '%s\n' "$RULES" | supabase db query --linked \
            || PGPASSWORD="$SUPABASE_DB_PASSWORD" psql -v ON_ERROR_STOP=1 \
                 "postgresql://postgres:$SUPABASE_DB_PASSWORD@db.$PROJECT_REF.supabase.co:5432/postgres" \
                 -c "$RULES" \
            || echo "::warning::Could not read the rulebook. If the tables are missing, the definitions have not landed."
          # And which clocks are actually wound, which no run has ever shown.
          #
          # Both `world-tick` and `stock-tick` are scheduled from a `do` block
          # ending `exception when others then raise notice`. That is
          # deliberate — a project without `pg_cron` is not a failed
          # deployment, and the suite's bare postgres has none — but it means
          # a green migrate job has never been evidence that the jobs exist.
          # Asked after the wildlife for a reason: `blocks` above only grows
          # if something is turning `stock_tick`, and this is the line that
          # says whether anything is.
          #
          # `cron.job` is not there to be read on a project without the
          # extension, so this is allowed to fail the same way the island read
          # is: loudly, in a warning, without taking the deployment with it.
          CLOCKS=$(cat <<'EOSQL'
          select j.jobname, j.schedule, j.active, left(j.command, 32) as runs
            from cron.job j order by j.jobname;
          EOSQL
          )
          supabase db query --linked "$CLOCKS" \
            || printf '%s\n' "$CLOCKS" | supabase db query --linked \
            || PGPASSWORD="$SUPABASE_DB_PASSWORD" psql -v ON_ERROR_STOP=1 \
                 "postgresql://postgres:$SUPABASE_DB_PASSWORD@db.$PROJECT_REF.supabase.co:5432/postgres" \
                 -c "$CLOCKS" \
            || echo "::warning::No clocks listed — either pg_cron is not installed on this project or cron.job could not be read. The island's heartbeat and its stocking both depend on it."

          # `cron.job_run_details` keys on `jobid`, not `jobname` -- the first
          # cut of this asked for `d.jobname` and got `column d.jobname does
          # not exist` three times over, which is how a diagnostic that has
          # never run once tends to go. The join is the whole fix.
          #
          # And how those clocks have actually been getting on, which is the
          # line this step was missing when somebody first said the island had
          # gone slow.
          #
          # Both ticks run every second and both take an advisory lock, so a
          # round that arrives while the last one is still going returns
          # `busy` and costs nothing. That is by design and is not what this
          # is looking for. What it is looking for is a round that *failed*:
          # `cron.job_run_details` keeps the message, and one failing job on a
          # one-second schedule is three and a half thousand errors an hour in
          # the log with no other sign of itself. Grouped, because three
          # thousand copies of one sentence is one fact.
          RUNS=$(cat <<'EOSQL'
          select j.jobname,
                 d.status,
                 count(*) as runs,
                 to_char(max(d.end_time), 'MM-DD HH24:MI') as last_seen,
                 left(coalesce(d.return_message, ''), 120) as said
            from cron.job_run_details d
            join cron.job j on j.jobid = d.jobid
           where d.start_time > now() - interval '6 hours'
           group by j.jobname, d.status, left(coalesce(d.return_message, ''), 120)
           order by d.status <> 'succeeded' desc, count(*) desc
           limit 20;
          EOSQL
          )
          supabase db query --linked "$RUNS" \
            || printf '%s\n' "$RUNS" | supabase db query --linked \
            || PGPASSWORD="$SUPABASE_DB_PASSWORD" psql -v ON_ERROR_STOP=1 \
                 "postgresql://postgres:$SUPABASE_DB_PASSWORD@db.$PROJECT_REF.supabase.co:5432/postgres" \
                 -c "$RUNS" \
            || echo "::warning::No clock runs listed — cron.job_run_details could not be read, so a failing heartbeat would be invisible here."
          # And where the time is actually going, when the project keeps the
          # numbers. `pg_stat_statements` is not on every project and is not
          # worth installing from a deploy, so this asks and shrugs.
          SLOW=$(cat <<'EOSQL'
          select left(regexp_replace(s.query, '\s+', ' ', 'g'), 70) as statement,
                 s.calls,
                 round(s.total_exec_time)::bigint as ms_total,
                 round(s.mean_exec_time::numeric, 2) as ms_each
            from pg_stat_statements s
           where s.query not like '%pg_stat_statements%'
           order by s.total_exec_time desc
           limit 12;
          EOSQL
          )
          supabase db query --linked "$SLOW" \
            || printf '%s\n' "$SLOW" | supabase db query --linked \
            || PGPASSWORD="$SUPABASE_DB_PASSWORD" psql -v ON_ERROR_STOP=1 \
                 "postgresql://postgres:$SUPABASE_DB_PASSWORD@db.$PROJECT_REF.supabase.co:5432/postgres" \
                 -c "$SLOW" \
            || echo "::notice::No statement timings — pg_stat_statements is not enabled on this project."

  found:
    name: Found an island on the project
    if: github.event_name == 'workflow_dispatch' && inputs.found
    needs: migrate
    runs-on: ubuntu-latest
    environment: AI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Work the ground out and hand it over, once
        env:
          ISLAND: ${{ inputs.island_name }}
          SIZE: ${{ inputs.size }}
          SEED: ${{ inputs.seed }}
        run: |
          # `pipefail`, because without it this step reported success while the
          # tool was dying on its second line: a pipeline answers for its last
          # command, and `tee` always succeeds. A founding job that founds
          # nothing and says it worked is worse than one that fails.
          set -o pipefail
          # The one time the land travels. After this nobody downloads it
          # again: a join carries the seed and every browser works out the
          # ground it is standing on. Postgres keeps this copy because the
          # rules are checked against it.
          npx esbuild tools/found-island.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/found.mjs --log-level=error
          node --max-old-space-size=4096 node_modules/.cache/found.mjs \
            --name "$ISLAND" --size "$SIZE" ${SEED:+--seed "$SEED"} | tee found.log
          echo "### The island" >> "$GITHUB_STEP_SUMMARY"
          tail -2 found.log >> "$GITHUB_STEP_SUMMARY"

  reconcile:
    name: Put the island and the browsers back on the same ground
    if: github.event_name == 'workflow_dispatch' && inputs.live && inputs.reconcile != 'off'
    needs: migrate
    runs-on: ubuntu-latest
    environment: AI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Read the land, work the same ground out, and say where they differ
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://glebtboagnafcgwjjvfy.supabase.co' }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ISLAND: ${{ inputs.island_name }}
          MODE: ${{ inputs.reconcile }}
        run: |
          # The land travelled once. Every browser has worked it out from the
          # seed ever since — with whatever generator it was built with. This
          # compares the island's own copy against what a browser would draw
          # today and, with `write`, puts every disagreement into tile_change,
          # which is the one thing every browser reads on every join.
          set -o pipefail
          if [ -z "$SUPABASE_KEY" ]; then
            echo "::error::Set SUPABASE_SERVICE_KEY in the 'AI' environment: this reads and writes land."
            exit 1
          fi
          npx esbuild tools/reconcile-land.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/reconcile.mjs --log-level=error
          node --max-old-space-size=4096 node_modules/.cache/reconcile.mjs \
            --name "$ISLAND" ${MODE:+$([ "$MODE" = write ] && echo --write)} | tee reconcile.log
          echo "### The ground" >> "$GITHUB_STEP_SUMMARY"
          tail -20 reconcile.log >> "$GITHUB_STEP_SUMMARY"

  smoke:
    name: Play on the real island
    if: github.event_name == 'workflow_dispatch' && inputs.live
    needs: migrate
    runs-on: ubuntu-latest
    environment: AI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Found one, play on it, check it, give it up
        env:
          ISLAND_SIZE: '64'
        run: |
          npx esbuild supabase/test/smoke.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/smoke.mjs --log-level=error
          node node_modules/.cache/smoke.mjs
