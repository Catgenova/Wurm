      - name: The Mender's perks, each where its rule is
        run: |
          # Each of the Mender's eighteen measured on the island, the dice put
          # either side of a perk's number where it is a chance: a go of Repair
          # and the time off the floor under it; the wear on a tool, armour, a
          # shield and a sword; a post and a snare standing longer for their
