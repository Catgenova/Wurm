# The island, checked three ways.
#
# `rules` needs nothing and runs on every push: a Postgres of its own, built
# from the migrations in this repo, with the whole suite over it. That is the
# one that catches things, and it costs no secrets and no project.
#
# `migrate` and `smoke` touch the real project and so need credentials. They
# exist because there are things no local database can tell you: whether
# anonymous sign-in is switched on, whether Realtime is publishing, whether the
# policies behave the same behind PostgREST as behind psql, and whether eight
# megabytes of island survives the trip.
name: Island

on:
  push:
    paths:
      - 'supabase/**'
      - 'src/net/**'
      - '.github/workflows/island.yml'
  pull_request:
    paths:
      - 'supabase/**'
      - 'src/net/**'
  workflow_dispatch:
    inputs:
      live:
        description: 'Also push migrations to the project and smoke-test it'
        type: boolean
        default: false
      found:
        description: 'Found a new island on the project and open it'
        type: boolean
        default: false
      size:
        description: 'How many tiles a side the new island is'
        default: '4096'
      island_name:
        description: 'What the new island is called'
        default: 'Wildermon'
      seed:
        description: 'Its seed; blank rolls one'
        default: ''
      reconcile:
        description: 'Put the island and the browsers back on the same ground'
        type: choice
        options: ['off', 'report', 'write']
        default: 'off'

jobs:
  rules:
    name: The rules, against a Postgres of our own
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wurm
          POSTGRES_PASSWORD: wurm
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: wurm
      PGPASSWORD: wurm
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: No migration has been deleted or renamed
        run: |
          # A migration the project has already run is a fact about its
          # history, and the CLI refuses to push when the remote holds a
          # version the repository has forgotten: "Remote migration versions
          # not found in local migrations directory". Replacing a function
          # means a NEW migration, never an edited or renamed one.
          gone=$(git diff --diff-filter=DR --name-only HEAD~1 HEAD -- supabase/migrations/ || true)
          if [ -n "$gone" ]; then
            echo "::error::These migrations were deleted or renamed, which will break 'supabase db push':"
            echo "$gone"
            exit 1
          fi
          echo "no migrations removed"
      - name: No migration has been added out of order
        run: |
          # Append-only is not only about editing: a migration added *before*
          # one the project has already run is one the CLI will refuse to push
          # ("Found local migration files to be inserted before the last
          # migration on remote database"). The generated definitions carry a
          # wall-clock stamp and the hand-written ones carry one chosen by
          # hand, so the two can cross. Caught here, it is a rename away from
          # fixed; caught at the project, it is a failed deploy.
          last=$(git ls-tree -r --name-only HEAD~1 -- supabase/migrations/ \
                 | xargs -r -n1 basename | sort | tail -1)
          added=$(git diff --diff-filter=A --name-only HEAD~1 HEAD -- supabase/migrations/ \
                  | xargs -r -n1 basename | sort)
          bad=""
          for m in $added; do
            [ -z "$last" ] && break
            if [ "$m" \< "$last" ]; then bad="$bad $m"; fi
          done
          if [ -n "$bad" ]; then
            echo "::error::These migrations sort before '$last', which the project may already have run:$bad"
            echo "::error::Rename them to a later timestamp before they reach the project."
            exit 1
          fi
          echo "nothing added out of order (latest before this commit: ${last:-none})"
      # `git diff` cannot see a file that is not tracked yet, and a fresh
      # `_defs.sql` is exactly that — so the old form of this check would have
      # let a brand new definitions migration through without noticing. Asking
      # `git status` about the whole directory catches both.
      - name: The definitions are still what the TypeScript says
        run: |
          npm run defs
          npm run db:bundle
          dirty=$(git status --porcelain supabase/migrations supabase/defs-state.sql supabase/all.sql)
          if [ -n "$dirty" ]; then
            echo "$dirty"
            echo "::error::The generated SQL is out of date. Run 'npm run defs' and 'npm run build', and commit what they write."
            exit 1
          fi
      # The live test is eight hundred lines that nothing typechecked: `tsconfig`
      # covered `src` and no more, so `smoke.ts` was first compiled by esbuild
      # inside the live job — after the migrations had been pushed to the real
      # project. A duplicate variable took a run down three minutes in.
      - name: The tests and tools that run outside a browser still compile
        run: npx tsc --noEmit -p tsconfig.node.json
      - name: Joining, refusing, digging, settling and who may write what
        run: supabase/test/run.sh
      - name: An island out through the wire format and back, corner by corner
        run: |
          npx esbuild supabase/test/landtrip.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/landtrip.mjs --log-level=error
          node node_modules/.cache/landtrip.mjs
      - name: The island's history lays onto land worked out as it goes
        run: |
          # The load-bearing half of a join, and the one the client cannot be
          # made to do without a network: replaying `tile_change` over a world
          # that is generated square by square as something asks for it. Get it
          # wrong and a tree felled an hour ago stands again.
          npx esbuild supabase/test/replay.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/replay.mjs --log-level=error
          node node_modules/.cache/replay.mjs
      - name: Where somebody has been survives the trip, and costs nothing to bring back
        run: |
          # The fog of war lived in `localStorage` and nowhere else, so a
          # refresh put a body in the middle of a black 4096 island. It is the
          # island's to keep now — and a join must not have to work out every
          # square anybody ever walked over in order to take it back.
          npx esbuild supabase/test/fog.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/fog.mjs --log-level=error
          node node_modules/.cache/fog.mjs
      - name: The island handed over is the island come back to
        run: |
          # Founding uploads what was rolled; joining works the ground out from
          # the seed and never downloads it. Two generators that disagreed
          # would put every player on ground the rules do not believe in, and
          # nothing else in this suite would notice.
          npx esbuild supabase/test/agree.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/agree.mjs --log-level=error
          node node_modules/.cache/agree.mjs
      - name: The ground a seed makes is the ground it made before
        run: |
          # The land travelled once, at founding, and Postgres has held that
          # copy ever since while every browser works the same ground out from
          # the seed. So the generator is a wire format with one message in it,
          # sent on founding day: change it and the ground moves under every
          # island already standing, silently, for tiles nobody has touched.
          # Measured against builds this repo shipped, one 256 window: c04881e
          # differs from today in 1367 of 65536 faces, 239 of them soft ground
          # the island would then refuse to let anybody pack.
          npx esbuild supabase/test/ground.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/ground.mjs --log-level=error
          node node_modules/.cache/ground.mjs
      - name: A bare face shows the rock it is made of
        run: |
          # Reported: ore and seams that break the surface drew as plain grey
          # rock. A tile dug bare gets the kind written into its data byte, on
          # both sides; a tile the generator lays down as rock does not — the
          # kind goes in the rock array and the byte stays at nought. The
          # drawing read the byte, so a thousand seams a window were invisible
          # while mining and prospecting knew about them all along.
          npx esbuild supabase/test/face.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/face.mjs --log-level=error
          node node_modules/.cache/face.mjs
      - name: The wild mix is the mix the weights ask for
        run: |
          # Reported as never having seen a mola. The stocker picked a tile,
          # rolled what stood up on it, and threw the roll away when the ground
          # was wrong for it — so a species came out as common as its weight
          # times the share of the island that suits it. A mola wants metal
          # under it, metal is a seventh of the ground, and a mola was one in
          # two hundred.
          npx esbuild supabase/test/wild.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/wild.mjs --log-level=error
          node node_modules/.cache/wild.mjs
      - name: A rack takes eight crates and says which spots are full
        run: |
          # Reported as no way to add crates to a crate shelf. The rules knew
          # about racks; the only way to reach the placing was the tile menu,
          # and a click on a tile with furniture on it opens the piece's menu
          # instead — so eight spots nobody could load, holding crates nobody
          # could click.
          npx esbuild supabase/test/rack.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/rack.mjs --log-level=error
          node node_modules/.cache/rack.mjs
      - name: The ground is the one on the chart
        run: |
          # And that the ground both generators agree on is the ground that was
          # drawn. They would agree just as contentedly on relief nobody asked
          # for: `land` and `depth` are multipliers on the chart's own range,
          # and if that range is not what they were written for, the shortfall
          # is quietly made up by the ridged noise.
          npx esbuild supabase/test/relief.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/relief.mjs --log-level=error
          node node_modules/.cache/relief.mjs
      - name: A thing in your hands crosses from the island whole
        run: |
          # Reported as "players cannot drink from water skins or fill them".
          # Both sides of that were right and the seam between them was not:
          # `play.ts` read six fields off an item row and dropped seven, so a
          # full skin arrived empty. Nothing measured the seam, which is why a
          # bug that broke seven features at once went unseen.
          npx esbuild supabase/test/pack.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/pack.mjs --log-level=error
          node node_modules/.cache/pack.mjs
      - name: What the island's answers say has happened to you
        run: |
          # Reported as "floating text only shows for climbing". The renderer
          # draws a floater off a skill gain or a hit, both of which come out
          # of the code that does the thing — and on an island the island does
          # it. Climbing is earned off your own feet, which is why it was the
          # one left. The change is worked out from what already arrives.
          npx esbuild supabase/test/felt.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/felt.mjs --log-level=error
          node node_modules/.cache/felt.mjs
      - name: What a rare thing is, and what a pass can turn one into
        run: |
          # Every rarity number is crossed from `RARITIES` into `rarity_def`,
          # so the two sides agree by construction — right up until somebody
          # writes one out again by hand. `improve_ceiling` did: it said a rare
          # thing could be bettered 4 past your skill while the table, the
          # browser and the island's own examine line all said 5. This puts the
          # two lists side by side, and rolls the ladder a quarter of a million
          # times to show a pass is one step up or none.
          npx esbuild supabase/test/rare.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/rare.mjs --log-level=error
          node node_modules/.cache/rare.mjs
      - name: Every goal the journal counts is a note the island writes
        run: |
          # Forty-six of the journal's eighty-five goals count things done, and
          # every one of those counts was written by a browser performer — so on
          # an island not one of them could ever tick, and nothing said so. The
          # notes are the island's now, and this is what says when one goes
          # missing: a goal whose key nobody sets looks exactly like a goal
          # nobody has got round to.
          npx esbuild supabase/test/writ.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/writ.mjs --log-level=error
          node node_modules/.cache/writ.mjs
      - name: Where the water starts, and where a pick stops
        run: |
          # Reported as a copper vein that would not be mined, with "You cannot
          # mine below the water level" and no water drawn on it. The island's
          # half of that is measured in island.sql against the rules; this is
          # the browser's half — that water is drawn from the first unit below
          # the line, so one dug corner is already a puddle, and that the
          # allowance both sides read is one number and not two.
          npx esbuild supabase/test/tide.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/tide.mjs --log-level=error
          node node_modules/.cache/tide.mjs
      - name: The land read is the same island as the history replayed
        run: |
          # Two roads to one place, which is the thing this island has been
          # bitten by more than any other. A join used to work the island out
          # from its seed and lay every row of `tile_change` over it, which
          # costs the area that has ever been worked and climbs for ever; it
          # reads the land itself now, which costs what the square is. Both are
          # driven here over one island with the same digging done to it and
          # compared byte for byte — heights, soil, tiles, data and rock — and
          # so is the seam that makes the swap safe: the cursor the window is
          # read at is taken before the land, so a spadeful turned in between
          # is replayed as well as read rather than lost between the two.
          npx esbuild supabase/test/window.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/window.mjs --log-level=error
          node node_modules/.cache/window.mjs
      - name: What a ground read is allowed to forget
        run: |
          # `rpc_ground` answers in two halves and `sawGround` has two kinds of
          # key: ones the answer always carries, which may be cleared and
          # replaced, and ones it carries only on the reconcile, which may not.
          # Getting that wrong does not look like a bug in the reading — it
          # looks like the thing itself flickering, once a second, for ever.
          # It has been got wrong twice in that one function now, for the
          # settlements and then for the crops, so it is a test rather than a
          # comment: `undefined` is "nothing said about this" and an empty list
          # is "nothing is there", and they are not the same answer.
          npx esbuild supabase/test/field.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/field.mjs --log-level=error
          node node_modules/.cache/field.mjs

      - name: What is lying on the ground reaches a browser
        run: |
          # The ground answer never carried a thing lying on the grass, and the
          # browser's map of the ground was only its own rules' to write, which
          # do not run on an island: a corpse was in Postgres and drawn by
          # nobody. The answer carries `lying` now, and this hands `sawGround`
          # one as the island sends it.
          npx esbuild supabase/test/lying.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/lying.mjs --log-level=error
          node node_modules/.cache/lying.mjs

      - name: Concrete goes on plain rock, never on a seam
        run: |
          # A corner holds up four tiles, and a vein under any of them raised
          # with concrete would be ore for ever. The browser's door, asked about
          # a shelf of bare rock with a vein, the coal, and plain rock under it.
          npx esbuild supabase/test/seam.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/seam.mjs --log-level=error
          node node_modules/.cache/seam.mjs

      - name: You turn on whatever bites you
        run: |
          # A bite used to mark you and hurt you and that was all. Bitten in a
          # game of its own, a body swings at the thing with what it had been
          # doing first in line behind it; a second bite changes nothing; a nip
          # from a tame one is no fight.
          npx esbuild supabase/test/turn.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/turn.mjs --log-level=error
          node node_modules/.cache/turn.mjs

      - name: A raw material bin takes raw materials and nothing else
        run: |
          # Ore, logs, dirt, shards and wool go in; a plank, a brick, a lump,
          # a hatchet and wheat are refused in the island's words. And the list
          # holds to its own rule: forty stackable materials, every ore and
          # every shard among them, none of them what a recipe makes.
          npx esbuild supabase/test/bins.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/bins.mjs --log-level=error
          node node_modules/.cache/bins.mjs

      - name: An anvil off the island keeps its metal
        run: |
          # The island hands an anvil's metal in `sub`, as its own rules read
          # it. A copper anvil set down on an island came to a browser as an
          # iron one; now it is the anvil it was poured as.
          npx esbuild supabase/test/anvil.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/anvil.mjs --log-level=error
          node node_modules/.cache/anvil.mjs

      - name: What the ground says about a cut it will not take
        run: |
          # A slope refusal carries its numbers on both sides, ground inside
          # somebody else's stake is refused, flattening steps round a corner
          # of bare rock instead of stopping at it, a level taken stops a run
          # of goes on the mark, and a spadeful comes out of the crate.
          npx esbuild supabase/test/cut.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/cut.mjs --log-level=error
          node node_modules/.cache/cut.mjs

      - name: What a go teaches the body, and what it does not
        run: |
          # Eating, drinking and carrying things about are not work: both sides
          # name the same twenty-five jobs that teach the body nothing, and a
          # loaf eaten in a game of its own leaves every stat where it was.
          npx esbuild supabase/test/body.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/body.mjs --log-level=error
          node node_modules/.cache/body.mjs
      - name: Everybody you may write to, each of them once
        run: |
          # Friends, the people off your own land, and anybody who has written
          # to you are three questions with the same answers in them, and the
          # Letters tab laid them end to end: a friend you had also invited
          # home was two rows of the same person. The Friends tab, three lines
          # away in the same file, had always folded them through a `Set`. So
          # the rule is a function now rather than a line inside the drawing,
          # and this asks it the question the screenshot asked.
          npx esbuild supabase/test/letters.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/letters.mjs --log-level=error
          node node_modules/.cache/letters.mjs
      - name: What Look says is coming for a tree, the same on both sides
        run: |
          # "The woods turn over in 9 hours, and it will be shrivelled. Prune
          # it to keep it." is one sentence written twice, once a side. A solo
          # world hears the browser's and an island the island's, and a player
          # who plays both should never be able to tell which — so every stage
          # of the age table is put to both, and the hour-words at their
          # thresholds, where a sentence turns.
          npx esbuild supabase/test/outlook.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/outlook.mjs --log-level=error
          node node_modules/.cache/outlook.mjs
      - name: A furnace off the island reads the way one you built yourself does
        run: |
          # The island writes a finished piece as {def, ql, count, extra} and a
          # job as {makes, left, total, ql}; the browser's item has an id and
          # its job an item. The list was taken as it came, cast and not looked
          # at, and a right-click on a smelter with a finished lump in it threw
          # out of the click handler and locked the input. So a smelter and a
          # kiln are handed over exactly as the island hands them, and asked
          # what the menu asks.
          npx esbuild supabase/test/furnace.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/furnace.mjs --log-level=error
          node node_modules/.cache/furnace.mjs
      - name: A slope you can stand on is the same slope on both sides
        run: |
          # The standing cap is written twice — `standsOn` and `standSlope` in
          # the browser, `walk_share` and `creature_tile_ok` on the island —
          # so the same dug ground is put to both: a tile seventy steep and
          # one fifty, a walker at climbing nought and then fifty asking to
          # step off the flat into each, and a wild thing asked whether it
          # would stand there.
          npx esbuild supabase/test/stand.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/stand.mjs --log-level=error
          node node_modules/.cache/stand.mjs

      - name: The crafting window offers a choice of wood
        run: |
          # Asked for: a pack with oak and pine in it, and a row that lets you
          # say which the piece is to be made of. `materialChoices` lists the
          # woods carried for the recipe, `recipeStatus` takes the one the row
          # is set to, the clicked stack still wins over it, and the thing
          # made comes out of the wood the row said.
          npx esbuild supabase/test/wood.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/wood.mjs --log-level=error
          node node_modules/.cache/wood.mjs

      - name: Eight more trees that bear, held to their islands
        run: |
          # The species of a tree is the low nibble and the top bit of its tile
          # byte now, and every byte from before has to read as it did; the
          # chart's regions each grow their own kinds and never another's; an
          # island of your own grows them all.
          npx esbuild supabase/test/orchard.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/orchard.mjs --log-level=error
          node node_modules/.cache/orchard.mjs

      - name: Thirty traits for a fight, each in four grades
        run: |
          # Fighting blood is a name and a grade rolled for it: thirty names in
          # all four tiers, a share of the wild's rolls, never two grades of one
          # name on an animal, and a line that climbs a grade of its own name.
          npx esbuild supabase/test/blood.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/blood.mjs --log-level=error
          node node_modules/.cache/blood.mjs

  migrate:
    name: Push the migrations to the project
    if: github.event_name == 'workflow_dispatch' && inputs.live
    needs: rules
    runs-on: ubuntu-latest
    environment: AI
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        id: cli
        continue-on-error: true
        with:
          version: latest
        env:
          # The action resolves "latest" through the GitHub API, unauthenticated
          # from a shared runner address, and a run failed with "rate limit
          # exceeded" before it had done anything at all. A token costs nothing
          # and takes the anonymous quota out of the path.
          GITHUB_TOKEN: ${{ github.token }}
      - name: Get the CLI another way if that did not work
        if: steps.cli.outcome != 'success'
        run: |
          # npm rather than the GitHub API: the same binary, fetched from a
          # registry that is not counting anonymous requests per address.
          echo "::warning::supabase/setup-cli failed; installing from npm instead."
          npm i -g supabase
          supabase --version
      - name: Link and push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'glebtboagnafcgwjjvfy' }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Set SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD in the 'supabase' environment."
            exit 1
          fi
          supabase --version
          supabase link --project-ref "$PROJECT_REF"
          # What is about to change, before it changes.
          supabase migration list --linked
          # `--include-all` because a migration can be *added* out of order
          # even though none is ever edited or renamed: the generated
          # definitions are stamped with the wall clock and the hand-written
          # ones are stamped by hand, and the two clocks are not the same
          # clock. The guard in `rules` is what makes this safe — it refuses a
          # commit that adds a migration sorting before one already in the
          # tree, so anything the CLI would slot in early has been checked.
          supabase db push --include-all
          supabase migration list --linked

  found:
    name: Found an island on the project
    if: github.event_name == 'workflow_dispatch' && inputs.found
    needs: migrate
    runs-on: ubuntu-latest
    environment: AI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Work the ground out and hand it over, once
        env:
          ISLAND: ${{ inputs.island_name }}
          SIZE: ${{ inputs.size }}
          SEED: ${{ inputs.seed }}
        run: |
          # `pipefail`, because without it this step reported success while the
          # tool was dying on its second line: a pipeline answers for its last
          # command, and `tee` always succeeds. A founding job that founds
          # nothing and says it worked is worse than one that fails.
          set -o pipefail
          # The one time the land travels. After this nobody downloads it
          # again: a join carries the seed and every browser works out the
          # ground it is standing on. Postgres keeps this copy because the
          # rules are checked against it.
          npx esbuild tools/found-island.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/found.mjs --log-level=error
          node --max-old-space-size=4096 node_modules/.cache/found.mjs \
            --name "$ISLAND" --size "$SIZE" ${SEED:+--seed "$SEED"} | tee found.log
          echo "### The island" >> "$GITHUB_STEP_SUMMARY"
          tail -2 found.log >> "$GITHUB_STEP_SUMMARY"

  reconcile:
    name: Put the island and the browsers back on the same ground
    if: github.event_name == 'workflow_dispatch' && inputs.live && inputs.reconcile != 'off'
    needs: migrate
    runs-on: ubuntu-latest
    environment: AI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Read the land, work the same ground out, and say where they differ
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://glebtboagnafcgwjjvfy.supabase.co' }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ISLAND: ${{ inputs.island_name }}
          MODE: ${{ inputs.reconcile }}
        run: |
          # The land travelled once. Every browser has worked it out from the
          # seed ever since — with whatever generator it was built with. This
          # compares the island's own copy against what a browser would draw
          # today and, with `write`, puts every disagreement into tile_change,
          # which is the one thing every browser reads on every join.
          set -o pipefail
          if [ -z "$SUPABASE_KEY" ]; then
            echo "::error::Set SUPABASE_SERVICE_KEY in the 'AI' environment: this reads and writes land."
            exit 1
          fi
          npx esbuild tools/reconcile-land.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/reconcile.mjs --log-level=error
          node --max-old-space-size=4096 node_modules/.cache/reconcile.mjs \
            --name "$ISLAND" ${MODE:+$([ "$MODE" = write ] && echo --write)} | tee reconcile.log
          echo "### The ground" >> "$GITHUB_STEP_SUMMARY"
          tail -20 reconcile.log >> "$GITHUB_STEP_SUMMARY"

  smoke:
    name: Play on the real island
    if: github.event_name == 'workflow_dispatch' && inputs.live
    needs: migrate
    runs-on: ubuntu-latest
    environment: AI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Found one, play on it, check it, give it up
        env:
          ISLAND_SIZE: '64'
        run: |
          npx esbuild supabase/test/smoke.ts --bundle --platform=node --format=esm \
            --outfile=node_modules/.cache/smoke.mjs --log-level=error
          node node_modules/.cache/smoke.mjs
