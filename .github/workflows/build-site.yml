# Safety net: if source changes land on main without a rebuilt site, rebuild
# and commit it so the GitHub Pages deployment never goes stale.
name: Build site

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The whole history: the build stamps the site with which deploy it is, by counting the commits on main.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Commit the rebuilt site if it changed
        run: |
          if git diff --quiet -- index.html assets; then
            echo "Site is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets
          git commit -m "Rebuild site"
          git push
